# Optional Ollama container for a Dockerized local-model server, as an
# alternative to running LM Studio on the host (docs: see the "local" vs.
# "ollama" Hermes profile).
#
# Why a separate file: this is a personal-infra add-on, not part of the base
# hermes-webui stack, so it's not merged into docker-compose.yml by default.
#
# TOGGLE:
#   docker compose -f docker-compose.ollama.yml up -d      # start
#   docker compose -f docker-compose.ollama.yml down       # stop
#   docker compose -f docker-compose.ollama.yml logs -f    # watch it
#
# hermes-webui reaches this container the same way it reaches host-run LM
# Studio: via host.docker.internal, because publishing the port to
# 127.0.0.1 on the host makes it visible there regardless of which Compose
# project started it (no shared Docker network needed between the two
# projects). Hermes profile: model.base_url=http://host.docker.internal:11434/v1
#
# GPU passthrough (NVIDIA): uncomment the `deploy` block below once
# nvidia-container-toolkit is installed and `docker run --gpus all ...`
# works on this host. CPU-only works but is slower.
#
# Context length: OLLAMA_CONTEXT_LENGTH sets Ollama's own default context
# window per loaded model (Ollama defaults to 2048 regardless of what a
# model supports, unless overridden) — Hermes Agent needs at least 64000.
# Verify after pulling a model with:
#   docker exec ollama ollama show <model> | grep -i context
#
# Memory math (learned the hard way): fp16 KV cache for an 8B model (32
# layers, 8 KV heads, head_dim 128) costs ~128KB/token. At 131072 context
# that's ~16GiB for the cache ALONE, on top of the model weights -- OOM'd
# even after raising the Docker VM's memory limit to 15.6GiB (see
# .wslconfig). OLLAMA_KV_CACHE_TYPE=q8_0 halves that; pinning
# OLLAMA_CONTEXT_LENGTH to Hermes's actual 64000 floor (not padded upward)
# keeps total usage (cache + ~4.9GB q4 weights) comfortably under budget
# even with other containers running on the same host.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=65536
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
