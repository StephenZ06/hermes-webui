<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Board</title>
<script>
// Runs synchronously before <body> is parsed/painted, so the real theme
// colors are already on :root by the time anything renders -- without
// this, the page briefly shows its light-fallback (or blank white, since a
// nested browsing context paints its own white canvas before any of its
// bytes apply regardless of the parent iframe element's own CSS
// background) until the bottom-of-body script got around to running,
// which is a visible flash on every hard refresh. window.__STICKY_THEME_VARS__
// is reused by the full syncThemeFromParent() further down so the list of
// vars lives in one place.
window.__STICKY_THEME_VARS__ = [
  '--bg', '--surface', '--surface-subtle', '--border', '--border2',
  '--text', '--muted', '--accent', '--accent-hover', '--accent-bg', '--font-ui'
];
(function() {
  try {
    var parentRoot = window.parent.document.documentElement;
    var cs = window.parent.getComputedStyle(parentRoot);
    var root = document.documentElement;
    window.__STICKY_THEME_VARS__.forEach(function(name) {
      var val = cs.getPropertyValue(name);
      if (val) root.style.setProperty(name, val.trim());
    });
    var primaryFg = cs.getPropertyValue('--panel-head-primary-fg');
    root.style.setProperty('--primary-fg', (primaryFg && primaryFg.trim()) || '#fff');
  } catch (e) { /* cross-origin or parent not ready -- :root's own fallbacks apply */ }
})();
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  /* Theme tokens: default light fallbacks, matching hermes-webui's own
     token names -- overwritten with the parent page's live computed values
     by syncThemeFromParent() below, so this follows whatever skin/dark-light
     state the rest of the app is in instead of a fixed palette. Note colors
     (yellow/green/pink/blue) stay literal -- those are the user's own note
     colors, like colored paper, not part of the app chrome. */
  :root{
    --yellow:#fff59d;--green:#a8e6a3;--pink:#f8bbd0;--blue:#90caf9;
    --bg:#f5f0e8;--surface:#e8e3da;--surface-subtle:rgba(255,255,255,.6);
    --border:rgba(0,0,0,.15);--border2:rgba(0,0,0,.1);
    --text:#333;--muted:#777;--accent:#5c6bc0;--accent-hover:#3f51b5;
    --accent-bg:rgba(92,107,194,.05);--primary-fg:#fff;
    --shadow:0 2px 8px rgba(0,0,0,.12);
    --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  }
  html{font-size:15px}
  body{font-family:var(--font-ui);background:var(--bg);min-height:100vh;color:var(--text)}

  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1rem 1.5rem;background:var(--surface);box-shadow:var(--shadow);
    position:sticky;top:0;z-index:100;
  }
  header h1{font-size:1.4rem;font-weight:700;letter-spacing:-.5px;color:var(--text)}
  header h1 span{color:var(--accent)}
  .header-actions{display:flex;gap:.5rem}
  .btn{
    border:none;padding:.45rem .9rem;border-radius:6px;cursor:pointer;
    font-size:.85rem;font-weight:600;transition:all .15s;font-family:var(--font-ui);
  }
  .btn-primary{background:var(--accent);color:var(--primary-fg)}
  .btn-primary:hover{background:var(--accent-hover)}

  .empty-state{
    padding:3rem 1.5rem;text-align:center;color:var(--muted);font-size:.9rem;
  }

  /* Undo banner */
  .undo-banner{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.6rem 1rem;background:var(--accent);color:var(--primary-fg);
    position:sticky;top:60px;z-index:90;font-size:.85rem;
  }
  .undo-banner[hidden]{display:none;}
  .undo-banner .btn{background:rgba(255,255,255,.2);color:var(--primary-fg);}
  .undo-banner .btn:hover{background:rgba(255,255,255,.3);}

  /* Header search + toggle */
  .header-actions{display:flex;align-items:center;gap:.5rem}
  .board-search{
    appearance:none;-webkit-appearance:none;border:1px solid var(--border2);border-radius:6px;
    background:var(--bg);color:var(--text);font-size:.8rem;padding:.35rem .6rem;
    outline:none;min-width:140px;width:180px;font-family:var(--font-ui);
  }
  .board-search:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
  .board-search::placeholder{color:var(--muted);}
  .btn-toggle{opacity:.7;background:transparent;color:var(--text);border:1px solid var(--border2);}
  .btn-toggle:hover{opacity:1;background:var(--surface-subtle);}
  .btn-toggle.active{opacity:1;background:var(--accent);color:var(--primary-fg);border-color:var(--accent);}

  /* Board */
  #board{
    display:flex;gap:1.2rem;padding:1.2rem;
    overflow-x:auto;align-items:flex-start;min-height:calc(100vh - 60px);
  }

  /* Column */
  .column{
    min-width:320px;max-width:380px;flex-shrink:0;
    background:var(--surface);border-radius:12px;
    padding:.8rem;box-shadow:var(--shadow);
  }
  .column.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
  .notes-container{min-height:60px}
  .col-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:.6rem;padding:0 .2rem;
  }
  .col-title{
    font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    border:none;background:transparent;outline:none;flex:1;color:var(--text);
    padding:4px 6px;border-radius:4px;cursor:text;
  }
  .col-title:focus{background:var(--surface-subtle)}
  .col-actions{display:flex;gap:.3rem;opacity:0;transition:opacity .15s}
  .col-header:hover .col-actions{opacity:1}
  .col-count{
    font-size:.7rem;background:var(--border2);color:var(--text);border-radius:10px;
    padding:1px 7px;margin-left:4px;font-weight:600;
  }
  .add-note-btn{
    width:100%;padding:.5rem;border:2px dashed var(--border);
    border-radius:8px;background:transparent;cursor:pointer;
    font-size:.8rem;color:var(--muted);transition:all .15s;font-family:var(--font-ui);
  }
  .add-note-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}

  /* Note */
  .note{
    border-radius:6px;padding:.6rem .7rem;margin-bottom:.5rem;
    box-shadow:0 1px 4px rgba(0,0,0,.1);cursor:grab;
    transition:transform .15s,box-shadow .15s;position:relative;
  }
  .note:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.15)}
  .note.dragging{opacity:.4;transform:rotate(2deg)}
  .note-header{display:flex;align-items:flex-start;justify-content:space-between;gap:.3rem}
  .note-title{
    font-size:.85rem;font-weight:600;flex:1;color:#000;
    border:none;background:transparent;outline:none;
    cursor:text;padding:2px 4px;border-radius:3px;resize:none;
    font-family:var(--font-ui);line-height:1.3;
  }
  .note-title:focus{background:rgba(255,255,255,.5)}
  .note-actions{display:flex;gap:.15rem;opacity:0;transition:opacity .15s;flex-shrink:0}
  .note:hover .note-actions{opacity:1}
  .icon-btn{
    width:22px;height:22px;border:none;background:rgba(0,0,0,.08);
    border-radius:4px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:.7rem;transition:background .15s;
    color:#555;
  }
  .icon-btn:hover{background:rgba(0,0,0,.18)}
  /* Note text always sits on the note's own pastel color, not the app's
     theme background, so it stays literal black regardless of dark/light
     skin -- only .note's own icon-btn (the × delete button), not the
     column header's, which should keep following the theme like the rest
     of the chrome. */
  .note .icon-btn{color:#000;}

  /* Color trigger button (note-actions): shows the note's current color,
     opens the color-picker modal below to change it. */
  .color-trigger-btn{border-radius:50%;border:2px solid rgba(0,0,0,.2);margin-right:.5rem;}
  .color-trigger-btn:hover{border-color:rgba(0,0,0,.4)}

  /* Color Dots (used inside the modal) */
  .color-dot{
    width:14px;height:14px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;transition:border-color .15s;
  }
  .color-dot:hover,.color-dot.active{border-color:rgba(0,0,0,.4)}
  .color-dot.color-dot-lg{width:32px;height:32px;border-width:3px;}

  /* Color picker modal */
  .color-picker-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
    align-items:center;justify-content:center;z-index:1000;
  }
  .color-picker-overlay.open{display:flex;}
  .color-picker-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:1rem 1.2rem;box-shadow:var(--shadow);min-width:220px;
  }
  .color-picker-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:.8rem;gap:1rem;
  }
  .color-picker-title{font-size:.9rem;font-weight:700;color:var(--text)}
  .color-picker-close{
    width:22px;height:22px;border:none;background:var(--border2);color:var(--text);
    border-radius:4px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:.8rem;
  }
  .color-picker-close:hover{background:var(--border)}
  .color-picker-swatches{display:flex;gap:.7rem;}

  /* Sub Items */
  .sub-items{margin-top:.4rem;padding-left:.2rem}
  .sub-item{
    display:flex;align-items:center;gap:.3rem;
    font-size:.75rem;padding:2px 0;color:#000;
  }
  .sub-item-dot{width:4px;height:4px;border-radius:50%;background:#999;flex-shrink:0}
  .sub-item-text{
    border:none;background:transparent;outline:none;flex:1;
    font-size:.75rem;font-family:var(--font-ui);padding:1px 3px;border-radius:3px;color:#000;
  }
  .sub-item-text:focus{background:rgba(255,255,255,.5)}
  .sub-item .icon-btn{width:16px;height:16px;font-size:.6rem;opacity:0}
  .sub-item:hover .icon-btn{opacity:1}
  .add-sub-btn{
    border:none;background:transparent;cursor:pointer;
    font-size:.7rem;color:#000;padding:2px 4px;margin-top:2px;
    font-family:var(--font-ui);transition:color .15s;
  }
  .add-sub-btn:hover{color:var(--accent)}

  @media(max-width:600px){
    html{font-size:14px}
    header{padding:.7rem .8rem;flex-wrap:wrap;gap:.5rem}
    header h1{font-size:1.05rem}
    .btn{padding:.4rem .7rem;font-size:.8rem}
    /* One column (nearly) fills the screen and scroll-snaps into place --
       swiping between columns reads like paging through cards rather than
       hunting across a wide horizontal strip. */
    #board{padding:.6rem;gap:.6rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .column{min-width:84vw;max-width:84vw;scroll-snap-align:start}
    .color-picker-panel{width:calc(100vw - 2.4rem);max-width:320px;min-width:0}
    .color-dot.color-dot-lg{width:38px;height:38px}
  }
</style>
</head>
<body>

<header>
  <h1 id="board-title">Sticky <span>Board</span></h1>
  <div class="header-actions" id="header-actions" style="visibility:hidden">
    <input type="search" id="note-search" class="board-search" placeholder="Search notes..." aria-label="Search notes">
  </div>
</header>

<div id="undo-banner" class="undo-banner" hidden>
  <span id="undo-message"></span>
  <button class="btn" id="btn-undo" type="button">Undo</button>
</div>

<div id="board"></div>
<div id="empty-state" class="empty-state" hidden>Select or create a board from the Notes sidebar.</div>

<script>
(function() {
  'use strict';

  // ── Theme sync ──────────────────────────────
  // This page is same-origin with the parent hermes-webui page (embedded
  // via iframe), so its live theme -- which skin, dark or light -- is
  // readable straight off the parent's <html> element instead of
  // duplicating hermes-webui's own skin palette definitions here (which
  // would drift out of sync the moment a skin's colors change there).
  var THEME_VARS = window.__STICKY_THEME_VARS__;

  function syncThemeFromParent() {
    try {
      var parentRoot = window.parent.document.documentElement;
      var cs = window.parent.getComputedStyle(parentRoot);
      var root = document.documentElement;
      THEME_VARS.forEach(function(name) {
        var val = cs.getPropertyValue(name);
        if (val) root.style.setProperty(name, val.trim());
      });
      // --panel-head-primary-fg is how hermes-webui itself picks a readable
      // color for text/icons on an --accent-colored button (light skins
      // fall back to white, dark skins flip to --bg) -- reuse that instead
      // of guessing contrast against an unknown accent color.
      var primaryFg = cs.getPropertyValue('--panel-head-primary-fg');
      root.style.setProperty('--primary-fg', (primaryFg && primaryFg.trim()) || '#fff');
    } catch (e) {
      // Cross-origin or parent not ready yet -- keep the light default
      // palette declared in :root above.
    }
  }

  function watchParentTheme() {
    try {
      var parentRoot = window.parent.document.documentElement;
      new MutationObserver(syncThemeFromParent).observe(parentRoot, {
        attributes: true, attributeFilter: ['class', 'data-skin']
      });
    } catch (e) { /* ignore */ }
  }

  // ── Helpers ────────────────────────────────
  var COLORS = ['#fff59d','#a8e6a3','#f8bbd0','#90caf9'];
  var BOARD_ID = new URLSearchParams(location.search).get('board');

  function uid() {
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function(k) {
        if (k === 'className') node.className = attrs[k];
        else if (k === 'textContent') node.textContent = attrs[k];
        else if (k.startsWith('data-')) node.setAttribute(k, attrs[k]);
        else if (k === 'style') node.style.cssText = attrs[k];
        else if (k === 'draggable') node.draggable = attrs[k];
        else if (k === 'value') node.value = attrs[k];
        else if (k === 'title') node.title = attrs[k];
        else if (k === 'type') node.type = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (children) {
      children.forEach(function(c) {
        if (c) node.appendChild(c);
      });
    }
    return node;
  }

  // ── State ──────────────────────────────────
  // A board (id, name, project_id, columns) is a server-managed entity now
  // -- created/renamed/deleted/linked-to-a-project from the Notes sidebar
  // (static/notes.js), not from this page. This page only ever renders and
  // edits the ONE board named in its own ?board=<id> query param (the
  // sidebar changes which board is shown by changing this iframe's src).
  var state = null; // { id, name, project_id, columns }
  var boardMissing = false;
  var _noteSearchTerm = '';
  var _undoAction = null;
  var _undoTimer = null;

  // Pre-defined workflow columns. Boards are normalised to exactly these
  // three columns on load; extra legacy columns have their notes merged into
  // General so no data is lost.
  var RESERVED_COLS = [
    { id: 'general', title: 'General' },
    { id: 'in-progress', title: 'In-Progress' },
    { id: 'completed', title: 'Completed' }
  ];

  function ensureReservedColumns(board) {
    if (!board) return;
    var columns = board.columns || (board.columns = []);
    var byId = {};
    columns.forEach(function(c) { byId[c.id] = c; });
    // Merge any non-reserved columns into General in their original order.
    var general = byId['general'];
    if (!general) {
      general = { id: 'general', title: 'General', notes: [] };
      columns.push(general);
    }
    var reordered = [];
    RESERVED_COLS.forEach(function(rc) {
      var existing = byId[rc.id];
      if (existing) {
        reordered.push(existing);
      } else {
        reordered.push({ id: rc.id, title: rc.title, notes: [] });
      }
    });
    columns.forEach(function(c) {
      if (!RESERVED_COLS.some(function(rc) { return rc.id === c.id; })) {
        general.notes = general.notes.concat(c.notes || []);
      }
    });
    board.columns = reordered;
  }

  function showEmptyState(show) {
    var boardEl = document.getElementById('board');
    var emptyEl = document.getElementById('empty-state');
    var headerActions = document.getElementById('header-actions');
    if (boardEl) boardEl.hidden = show;
    if (emptyEl) emptyEl.hidden = !show;
    if (headerActions) headerActions.style.visibility = show ? 'hidden' : '';
  }

  // Persisted server-side (api/sticky_board.py, STATE_DIR/sticky_boards.json)
  // so a board is shared across every browser/device open on this hermes-webui
  // instance, not just the one that created it -- and, if linked to a project
  // folder, mirrored into that project's AGENTS.md for chats to see.
  function loadState() {
    if (!BOARD_ID) {
      boardMissing = true;
      showEmptyState(true);
      return Promise.resolve();
    }
    return fetch('/api/sticky_boards').then(function(res) { return res.json(); }).then(function(data) {
      var boards = (data && Array.isArray(data.boards)) ? data.boards : [];
      var found = boards.find(function(b) { return b.id === BOARD_ID; });
      if (!found) {
        boardMissing = true;
        showEmptyState(true);
        return;
      }
      state = found;
      if (!Array.isArray(state.columns)) state.columns = [];
      ensureReservedColumns(state);
      var titleEl = document.getElementById('board-title');
      if (titleEl) titleEl.textContent = state.name || 'Sticky Board';
      showEmptyState(false);
    }).catch(function(e) {
      console.error('sticky-board: could not load from server', e);
      boardMissing = true;
      showEmptyState(true);
    });
  }

  // This page is embedded in hermes-webui via an iframe on the same origin.
  // The parent document auto-attaches an X-Hermes-CSRF-Token to its own
  // fetch() calls (see its inline bootstrap script), but that patch lives on
  // the parent's `window`, not this iframe's separate one -- so POSTs from
  // here need the token pulled from the parent and attached by hand, or the
  // backend's CSRF check (api/routes.py's _check_csrf) 403s them.
  function csrfHeaders() {
    var token = '';
    try {
      token = (window.parent && window.parent.__HERMES_CONFIG__ && window.parent.__HERMES_CONFIG__.csrfToken) || '';
    } catch (e) { /* cross-origin or parent not ready -- fall back to no token */ }
    return token ? { 'X-Hermes-CSRF-Token': token } : {};
  }

  function saveState() {
    if (!state) return;
    // Capture the payload before the request starts. The user may keep typing
    // while it is in flight; the parent must receive the snapshot the server
    // actually acknowledged, not a later unsaved in-memory mutation.
    var columnsSnapshot = JSON.parse(JSON.stringify(state.columns));
    var headers = csrfHeaders();
    headers['Content-Type'] = 'application/json';
    fetch('/api/sticky_boards/save', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ id: state.id, columns: columnsSnapshot })
    }).then(function(response) {
      if (!response.ok) throw new Error('Sticky board save failed');
      try {
        if (window.parent) {
          window.parent.postMessage({ type: 'sticky-board:saved', boardId: state.id, columns: columnsSnapshot }, location.origin);
        }
      } catch (e) { /* ignore */ }
    }).catch(function(e) {
      console.error('sticky-board: save to server failed', e);
    });
  }

  function findCol(colId) {
    return state.columns.find(function(c) { return c.id === colId; });
  }

  function findNote(colId, noteId) {
    var col = findCol(colId);
    return col ? col.notes.find(function(n) { return n.id === noteId; }) : null;
  }

  // Themed confirmation from the parent app; falls back to the browser's
  // native dialog when the page is loaded outside the iframe.
  async function appConfirm(opts) {
    try {
      var confirmFn = window.parent && window.parent.showConfirmDialog;
      if (confirmFn) return await confirmFn(opts);
    } catch (e) { /* ignore */ }
    var msg = (opts.title ? opts.title + '\n\n' : '') + (opts.message || '');
    return confirm(msg);
  }

  function showParentToast(msg, type) {
    try {
      var toastFn = window.parent && window.parent.showToast;
      if (toastFn) toastFn(msg, 2500, type);
    } catch (e) { /* ignore */ }
  }

  // ── Undo banner ────────────────────────────
  function showUndo(message, action) {
    _undoAction = action;
    clearTimeout(_undoTimer);
    var banner = document.getElementById('undo-banner');
    var msgEl = document.getElementById('undo-message');
    if (banner && msgEl) {
      msgEl.textContent = message;
      banner.hidden = false;
    }
    _undoTimer = setTimeout(clearUndo, 6000);
  }

  function clearUndo() {
    _undoAction = null;
    clearTimeout(_undoTimer);
    var banner = document.getElementById('undo-banner');
    if (banner) banner.hidden = true;
  }

  function undo() {
    if (!_undoAction) return;
    var action = _undoAction;
    clearUndo();
    if (action.kind === 'column') {
      state.columns.splice(action.index, 0, action.col);
    } else if (action.kind === 'note') {
      var col = findCol(action.colId);
      if (col) col.notes.splice(action.index, 0, action.note);
    }
    saveState(); render();
    showParentToast('Undo successful', 'success');
  }

  // ── Build DOM safely ───────────────────────
  function buildColorDot(color, noteColor, colId, noteId, extraClass) {
    var dot = el('span', {
      className: 'color-dot' + (extraClass ? ' ' + extraClass : '') + (color === noteColor ? ' active' : ''),
      style: 'background:' + color,
      'data-action': 'set-color',
      'data-col-id': colId,
      'data-note-id': noteId,
      'data-color': color
    });
    return dot;
  }

  function buildSubItem(text, colId, noteId, idx) {
    var dot = el('span', { className: 'sub-item-dot' });
    var input = el('input', {
      className: 'sub-item-text',
      value: text,
      'data-action': 'edit-sub',
      'data-col-id': colId,
      'data-note-id': noteId,
      'data-sub-idx': String(idx)
    });
    var delBtn = el('button', {
      className: 'icon-btn',
      'data-action': 'delete-sub',
      'data-col-id': colId,
      'data-note-id': noteId,
      'data-sub-idx': String(idx),
      textContent: '×'
    });
    return el('div', { className: 'sub-item' }, [dot, input, delBtn]);
  }

  function buildNote(colId, note) {
    // Title input
    var titleInput = el('input', {
      className: 'note-title',
      value: note.title,
      'data-action': 'edit-note-title',
      'data-col-id': colId,
      'data-note-id': note.id
    });
    // Color trigger -- shows the note's current color, opens the color
    // picker modal to change it (moved off the note's front on request;
    // it used to be four dots shown inline on every note).
    var colorBtn = el('button', {
      className: 'icon-btn color-trigger-btn',
      style: 'background:' + note.color,
      'data-action': 'open-color-picker',
      'data-col-id': colId,
      'data-note-id': note.id,
      title: 'Change color'
    });
    // Delete button
    var delBtn = el('button', {
      className: 'icon-btn',
      'data-action': 'delete-note',
      'data-col-id': colId,
      'data-note-id': note.id,
      title: 'Delete',
      textContent: '×'
    });
    var actionsDiv = el('div', { className: 'note-actions' }, [colorBtn, delBtn]);
    var headerDiv = el('div', { className: 'note-header' }, [titleInput, actionsDiv]);

    // Sub items
    var subItemEls = note.subItems.map(function(s, i) {
      return buildSubItem(s, colId, note.id, i);
    });
    var subsDiv = el('div', { className: 'sub-items' }, subItemEls);

    // Add sub button
    var addSubBtn = el('button', {
      className: 'add-sub-btn',
      'data-action': 'add-sub',
      'data-col-id': colId,
      'data-note-id': note.id,
      textContent: '+ Sub-item'
    });

    var noteDiv = el('div', {
      className: 'note',
      style: 'background:' + note.color,
      draggable: true,
      'data-col-id': colId,
      'data-note-id': note.id,
      tabindex: '0'
    }, [headerDiv, subsDiv, addSubBtn]);

    return noteDiv;
  }

  function buildColumn(col) {
    // Filter by search term for display; keep the user's manual order otherwise.
    var term = _noteSearchTerm.toLowerCase();
    var visibleNotes = col.notes.filter(function(n) {
      if (!term) return true;
      var hay = (n.title || '') + ' ' + (n.subItems || []).join(' ');
      return hay.toLowerCase().indexOf(term) !== -1;
    });
    var isReserved = RESERVED_COLS.some(function(rc) { return rc.id === col.id; });

    // Header
    var titleInput = el('input', {
      className: 'col-title',
      value: col.title,
      'data-action': 'edit-col-title',
      'data-col-id': col.id
    });
    if (isReserved) titleInput.readOnly = true;
    var countSpan = el('span', { className: 'col-count', textContent: String(col.notes.length) });
    var colHeaderChildren = [titleInput, countSpan];
    if (!isReserved) {
      var delColBtn = el('button', {
        className: 'icon-btn',
        'data-action': 'delete-col',
        'data-col-id': col.id,
        title: 'Delete column',
        textContent: '×'
      });
      colHeaderChildren.push(el('div', { className: 'col-actions' }, [delColBtn]));
    }
    var colHeader = el('div', { className: 'col-header' }, colHeaderChildren);

    // Notes container
    var noteEls = visibleNotes.map(function(n) { return buildNote(col.id, n); });
    var notesContainer = el('div', {
      className: 'notes-container',
      'data-col-id': col.id
    }, noteEls);

    // Drag events on notes container
    notesContainer.addEventListener('dragover', onDragOver);
    notesContainer.addEventListener('dragleave', onDragLeave);
    notesContainer.addEventListener('drop', onDrop);

    // Add note button
    var addNoteBtn = el('button', {
      className: 'add-note-btn',
      'data-action': 'add-note',
      'data-col-id': col.id,
      textContent: '+ New Note'
    });

    return el('div', {
      className: 'column',
      'data-col-id': col.id
    }, [colHeader, notesContainer, addNoteBtn]);
  }

  // ── Render ─────────────────────────────────
  function render() {
    if (!state) return;
    var board = document.getElementById('board');
    board.textContent = ''; // clear safely

    state.columns.forEach(function(col) {
      board.appendChild(buildColumn(col));
    });
  }

  // ── CRUD ───────────────────────────────────
  function addColumn() {
    if (!state) return;
    state.columns.push({ id:uid(), title:'New Column', color:'#fff59d', notes:[] });
    saveState(); render();
  }

  async function deleteColumn(colId) {
    var col = findCol(colId);
    if (!col) return;
    var noteCount = col.notes.length;
    if (noteCount > 0) {
      var ok = await appConfirm({
        title: 'Delete column?',
        message: 'Delete column "' + col.title + '" with ' + noteCount + ' note' + (noteCount === 1 ? '' : 's') + '? This cannot be undone.',
        confirmLabel: 'Delete',
        danger: true,
        focusCancel: true
      });
      if (!ok) return;
    }
    var colIndex = state.columns.indexOf(col);
    var snapshot = JSON.parse(JSON.stringify(col));
    state.columns = state.columns.filter(function(c) { return c.id !== colId });
    saveState(); render();
    showUndo('Column "' + snapshot.title + '" deleted', { kind: 'column', col: snapshot, index: colIndex });
  }

  function addNote(colId) {
    var col = findCol(colId);
    if (!col) return;
    col.notes.push({ id:uid(), title:'New Note', color:col.color || '#fff59d', subItems:[] });
    saveState(); render();
    var notes = document.querySelectorAll('.note[data-col-id="' + colId + '"]');
    var last = notes[notes.length - 1];
    if (last) { var inp = last.querySelector('.note-title'); inp.focus(); inp.select(); }
  }

  async function deleteNote(colId, noteId) {
    var col = findCol(colId);
    if (!col) return;
    var note = col.notes.find(function(n) { return n.id === noteId; });
    if (!note) return;
    var ok = await appConfirm({
      title: 'Delete note?',
      message: 'Delete note "' + (note.title || 'New Note') + '"? This cannot be undone.',
      confirmLabel: 'Delete',
      danger: true,
      focusCancel: true
    });
    if (!ok) return;
    var noteIndex = col.notes.indexOf(note);
    var snapshot = JSON.parse(JSON.stringify(note));
    col.notes = col.notes.filter(function(n) { return n.id !== noteId; });
    saveState(); render();
    showUndo('Note deleted', { kind: 'note', note: snapshot, colId: colId, index: noteIndex });
  }

  // Move a note to a different column with a smooth visual animation.
  function moveNoteToColumn(noteId, targetColId, opts) {
    opts = opts || {};
    var sourceCol = null, note = null, sourceIdx = -1;
    (state.columns || []).forEach(function(col) {
      col.notes.forEach(function(n, idx) {
        if (n.id === noteId && !sourceCol) {
          sourceCol = col; note = n; sourceIdx = idx;
        }
      });
    });
    if (!sourceCol || sourceCol.id === targetColId) return false;
    var targetCol = findCol(targetColId);
    if (!targetCol) return false;

    var noteEl = document.querySelector('.note[data-note-id="' + noteId + '"]');
    var fromRect = noteEl ? noteEl.getBoundingClientRect() : null;

    sourceCol.notes.splice(sourceIdx, 1);
    if (opts.prepend) {
      targetCol.notes.unshift(note);
    } else {
      targetCol.notes.push(note);
    }
    saveState(); render();

    if (fromRect) {
      var newEl = document.querySelector('.note[data-note-id="' + noteId + '"]');
      var toRect = newEl ? newEl.getBoundingClientRect() : null;
      if (toRect) {
        var ghost = noteEl.cloneNode(true);
        ghost.style.position = 'fixed';
        ghost.style.left = fromRect.left + 'px';
        ghost.style.top = fromRect.top + 'px';
        ghost.style.width = fromRect.width + 'px';
        ghost.style.height = fromRect.height + 'px';
        ghost.style.margin = '0';
        ghost.style.zIndex = '1000';
        ghost.style.pointerEvents = 'none';
        ghost.style.transition = 'transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s';
        document.body.appendChild(ghost);
        ghost.getBoundingClientRect();
        ghost.style.transform = 'translate(' + (toRect.left - fromRect.left) + 'px,' + (toRect.top - fromRect.top) + 'px)';
        setTimeout(function() { ghost.remove(); }, 360);
      }
    }
    return true;
  }

  function addSubItem(colId, noteId) {
    var note = findNote(colId, noteId);
    if (!note) return;
    note.subItems.push('');
    saveState(); render();
    var noteEl = document.querySelector('.note[data-note-id="' + noteId + '"]');
    if (noteEl) {
      var inputs = noteEl.querySelectorAll('.sub-item-text');
      var last = inputs[inputs.length - 1];
      if (last) last.focus();
    }
  }

  // Enter on a sub-item inserts a new empty one right below it and focuses
  // it, like a checklist -- see the keydown listener below.
  function insertSubItemAfter(colId, noteId, idx) {
    var note = findNote(colId, noteId);
    if (!note) return;
    note.subItems.splice(idx + 1, 0, '');
    saveState(); render();
    var noteEl = document.querySelector('.note[data-note-id="' + noteId + '"]');
    if (noteEl) {
      var inputs = noteEl.querySelectorAll('.sub-item-text');
      var next = inputs[idx + 1];
      if (next) next.focus();
    }
  }

  function deleteSubItem(colId, noteId, idx) {
    var note = findNote(colId, noteId);
    if (!note) return;
    note.subItems.splice(idx, 1);
    saveState(); render();
  }

  // ── Color picker modal ─────────────────────
  // One overlay, built once and appended to <body> (a sibling of #board,
  // not inside it, so render()'s `board.textContent = ''` never touches
  // it) -- repopulated with the target note's swatches each time it opens.
  var colorPickerOverlay = null;
  var colorPickerSwatches = null;

  function initColorPickerModal() {
    var closeBtn = el('button', {
      className: 'color-picker-close',
      'data-action': 'close-color-picker',
      'aria-label': 'Close',
      textContent: '×'
    });
    var titleEl = el('div', { className: 'color-picker-title', textContent: 'Choose a color' });
    var headerEl = el('div', { className: 'color-picker-header' }, [titleEl, closeBtn]);
    colorPickerSwatches = el('div', { className: 'color-picker-swatches' });
    var panel = el('div', { className: 'color-picker-panel' }, [headerEl, colorPickerSwatches]);
    colorPickerOverlay = el('div', { className: 'color-picker-overlay' }, [panel]);
    colorPickerOverlay.addEventListener('click', function(e) {
      if (e.target === colorPickerOverlay) closeColorPicker();
    });
    document.body.appendChild(colorPickerOverlay);
  }

  function openColorPicker(colId, noteId) {
    var note = findNote(colId, noteId);
    if (!note) return;
    colorPickerSwatches.textContent = '';
    COLORS.forEach(function(c) {
      colorPickerSwatches.appendChild(buildColorDot(c, note.color, colId, noteId, 'color-dot-lg'));
    });
    colorPickerOverlay.classList.add('open');
  }

  function closeColorPicker() {
    if (colorPickerOverlay) colorPickerOverlay.classList.remove('open');
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeColorPicker();
  });

  // ── Event Delegation ───────────────────────
  document.addEventListener('click', function(e) {
    var t = e.target;
    var action = t.getAttribute('data-action');
    if (!action) return;
    var colId = t.getAttribute('data-col-id');
    var noteId = t.getAttribute('data-note-id');
    var subIdx = t.getAttribute('data-sub-idx');
    var color = t.getAttribute('data-color');

    switch(action) {
      case 'add-note': addNote(colId); break;
      case 'delete-note': deleteNote(colId, noteId); break;
      case 'toggle-done':
        var tdNote = findNote(colId, noteId);
        if (tdNote) { tdNote.done = !tdNote.done; saveState(); render(); }
        break;
      case 'delete-col': deleteColumn(colId); break;
      case 'add-sub': addSubItem(colId, noteId); break;
      case 'delete-sub': deleteSubItem(colId, noteId, parseInt(subIdx)); break;
      case 'open-color-picker': openColorPicker(colId, noteId); break;
      case 'close-color-picker': closeColorPicker(); break;
      case 'set-color':
        var n = findNote(colId, noteId);
        if (n) { n.color = color; saveState(); render(); }
        closeColorPicker();
        break;
    }
  });

  // Inline editing
  function handleEdit(e) {
    var t = e.target;
    var action = t.getAttribute('data-action');
    if (!action) return;
    var colId = t.getAttribute('data-col-id');
    var noteId = t.getAttribute('data-note-id');
    var subIdx = t.getAttribute('data-sub-idx');
    var val = t.value.trim();

    switch(action) {
      case 'edit-col-title':
        var col = findCol(colId);
        if (col && val && !RESERVED_COLS.some(function(rc) { return rc.id === col.id; })) { col.title = val; saveState(); }
        break;
      case 'edit-note-title':
        var note = findNote(colId, noteId);
        if (note) { note.title = val || 'New Note'; saveState(); }
        break;
      case 'edit-sub':
        var note2 = findNote(colId, noteId);
        if (note2) { note2.subItems[parseInt(subIdx)] = val; saveState(); }
        break;
    }
  }

  document.addEventListener('change', handleEdit);
  document.addEventListener('focusout', handleEdit);

  // Enter on a sub-item: save what's typed so far (the 'change'/'focusout'
  // handlers above haven't fired yet -- the field isn't blurred), then
  // insert a fresh sub-item right after it and focus that one. Backspace on
  // an already-empty sub-item deletes it and moves focus to the end of the
  // previous one instead -- the standard checklist/outline behavior (Notion,
  // Trello, ...). Backspace is deliberately NOT hijacked while there's still
  // text to delete: only fires when the field is empty (checked via value,
  // not selection -- an empty field trivially has its caret at position 0),
  // so ordinary character-by-character editing is untouched.
  function deleteSubItemFocusPrev(colId, noteId, idx) {
    var note = findNote(colId, noteId);
    if (!note) return;
    note.subItems.splice(idx, 1);
    saveState(); render();
    if (idx > 0) {
      var noteEl = document.querySelector('.note[data-note-id="' + noteId + '"]');
      var prev = noteEl && noteEl.querySelectorAll('.sub-item-text')[idx - 1];
      if (prev) {
        prev.focus();
        var end = prev.value.length;
        prev.setSelectionRange(end, end);
      }
    }
  }

  document.addEventListener('keydown', function(e) {
    var t = e.target;
    if (!t.classList) return;
    // Enter saves inline title edits; Escape reverts them.
    if (t.classList.contains('col-title') || t.classList.contains('note-title')) {
      if (e.key === 'Enter') {
        e.preventDefault();
        t.blur();
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        t.value = t.defaultValue;
        t.blur();
        return;
      }
      return;
    }
    if (!t.classList.contains('sub-item-text')) return;
    var colId = t.getAttribute('data-col-id');
    var noteId = t.getAttribute('data-note-id');
    var idx = parseInt(t.getAttribute('data-sub-idx'), 10);

    if (e.key === 'Enter') {
      e.preventDefault();
      var note = findNote(colId, noteId);
      if (note) note.subItems[idx] = t.value.trim();
      insertSubItemAfter(colId, noteId, idx);
    } else if (e.key === 'Backspace' && t.value === '') {
      e.preventDefault();
      // render() below clears #board and rebuilds it, which desyncs this
      // input from the DOM while it still has focus -- the browser then
      // fires a native blur/focusout on it as part of that removal, which
      // bubbles into handleEdit's 'edit-sub' case and would otherwise
      // rewrite `note.subItems[idx]` (still pointing at the slot we're
      // about to delete) back in *after* the splice, undoing it. Blurring
      // here first lets that handler run and settle against the still-
      // intact array (a harmless same-value rewrite) before we touch it.
      t.blur();
      deleteSubItemFocusPrev(colId, noteId, idx);
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      // Move focus between sub-items in the same note, preserving the
      // caret's column position (clamped to the target's length) instead
      // of always jumping to the end -- feels like a normal multi-line
      // editor rather than a series of unrelated fields.
      var noteEl = t.closest('.note');
      if (!noteEl) return;
      var inputs = noteEl.querySelectorAll('.sub-item-text');
      var pos = Array.prototype.indexOf.call(inputs, t);
      var target = inputs[e.key === 'ArrowUp' ? pos - 1 : pos + 1];
      if (target) {
        e.preventDefault();
        var offset = Math.min(t.selectionStart, target.value.length);
        target.focus();
        target.setSelectionRange(offset, offset);
      }
    }
  });

  // ── Drag & Drop ────────────────────────────
  var dragData = null;

  document.addEventListener('dragstart', function(e) {
    var noteEl = e.target.closest('.note');
    if (!noteEl) return;
    dragData = {
      colId: noteEl.getAttribute('data-col-id'),
      noteId: noteEl.getAttribute('data-note-id')
    };
    noteEl.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
  });

  document.addEventListener('dragend', function(e) {
    var noteEl = e.target.closest('.note');
    if (noteEl) noteEl.classList.remove('dragging');
    document.querySelectorAll('.column').forEach(function(c) {
      c.classList.remove('drag-over');
    });
    dragData = null;
  });

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    this.closest('.column').classList.add('drag-over');
  }

  function onDragLeave() {
    this.closest('.column').classList.remove('drag-over');
  }

  function onDrop(e) {
    e.preventDefault();
    this.closest('.column').classList.remove('drag-over');
    if (!dragData) return;
    var targetColId = this.getAttribute('data-col-id');
    var sourceCol = findCol(dragData.colId);
    var targetCol = findCol(targetColId);
    if (!sourceCol || !targetCol) return;

    var noteIdx = sourceCol.notes.findIndex(function(n) { return n.id === dragData.noteId; });
    if (noteIdx === -1) return;
    var movedNote = sourceCol.notes.splice(noteIdx, 1)[0];

    // Find drop position
    var noteEls = this.querySelectorAll('.note:not(.dragging)');
    var insertIdx = targetCol.notes.length;
    for (var i = 0; i < noteEls.length; i++) {
      var rect = noteEls[i].getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) {
        insertIdx = i;
        break;
      }
    }
    targetCol.notes.splice(insertIdx, 0, movedNote);
    saveState(); render();
  }

  // ── Header Buttons ─────────────────────────
  var noteSearchInput = document.getElementById('note-search');
  if (noteSearchInput) {
    noteSearchInput.addEventListener('input', function(e) {
      _noteSearchTerm = e.target.value || '';
      render();
    });
  }

  var undoBtn = document.getElementById('btn-undo');
  if (undoBtn) undoBtn.addEventListener('click', undo);

  // ── Keyboard shortcuts ─────────────────────
  // Arrow keys move between note/column titles; Ctrl/Cmd+Enter adds a note
  // to the focused column; Delete removes a focused note/column.
  function colForInput(input) {
    var colId = input.getAttribute('data-col-id');
    return colId ? findCol(colId) : null;
  }

  function noteTitleInputsForCol(colId) {
    var colEl = document.querySelector('.column[data-col-id="' + colId + '"]');
    return colEl ? Array.from(colEl.querySelectorAll('.note-title')) : [];
  }

  function focusNoteTitle(colId, noteId) {
    var inputs = noteTitleInputsForCol(colId);
    var t = inputs.find(function(inp) { return inp.getAttribute('data-note-id') === noteId; });
    if (!t && inputs.length) t = inputs[0];
    if (t) { t.focus(); t.select(); }
  }

  function focusColumnTitle(index) {
    var cols = document.querySelectorAll('.column');
    var c = cols[Math.max(0, Math.min(index, cols.length - 1))];
    if (c) { var t = c.querySelector('.col-title'); if (t) { t.focus(); t.select(); } }
  }

  document.addEventListener('keydown', function(e) {
    var t = e.target;
    if (!t || !t.classList) return;
    var isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    var mod = isMac ? e.metaKey : e.ctrlKey;

    // Ctrl/Cmd+Enter: add a new note to the relevant column.
    if (mod && e.key === 'Enter') {
      var colId = t.getAttribute('data-col-id');
      if (colId) {
        e.preventDefault();
        addNote(colId);
        return;
      }
    }

    // Note title navigation
    if (t.classList.contains('note-title')) {
      var noteColId = t.getAttribute('data-col-id');
      var noteId = t.getAttribute('data-note-id');
      var inputs = noteTitleInputsForCol(noteColId);
      var pos = inputs.indexOf(t);
      var allCols = Array.from(document.querySelectorAll('.column'));
      var colEl = t.closest('.column');
      var colIdx = colEl ? allCols.indexOf(colEl) : -1;

      if (e.key === 'ArrowUp' && pos > 0) {
        e.preventDefault(); inputs[pos - 1].focus(); inputs[pos - 1].select();
      } else if (e.key === 'ArrowDown' && pos < inputs.length - 1) {
        e.preventDefault(); inputs[pos + 1].focus(); inputs[pos + 1].select();
      } else if (e.key === 'ArrowLeft' && colIdx > 0) {
        e.preventDefault();
        var prevInputs = noteTitleInputsForCol(allCols[colIdx - 1].getAttribute('data-col-id'));
        var pt = prevInputs[Math.min(pos, prevInputs.length - 1)];
        if (pt) { pt.focus(); pt.select(); }
      } else if (e.key === 'ArrowRight' && colIdx < allCols.length - 1) {
        e.preventDefault();
        var nextInputs = noteTitleInputsForCol(allCols[colIdx + 1].getAttribute('data-col-id'));
        var nt = nextInputs[Math.min(pos, nextInputs.length - 1)];
        if (nt) { nt.focus(); nt.select(); }
      } else if (e.key === 'Delete') {
        e.preventDefault(); deleteNote(noteColId, noteId);
      }
      return;
    }

    // Column title navigation + delete
    if (t.classList.contains('col-title')) {
      var colId = t.getAttribute('data-col-id');
      var cols2 = state.columns;
      var idx = cols2.findIndex(function(c) { return c.id === colId; });
      if (e.key === 'ArrowLeft' && idx > 0) {
        e.preventDefault(); focusColumnTitle(idx - 1);
      } else if (e.key === 'ArrowRight' && idx < cols2.length - 1) {
        e.preventDefault(); focusColumnTitle(idx + 1);
      } else if (e.key === 'Delete') {
        e.preventDefault(); deleteColumn(colId);
      }
      return;
    }
  });

  // Switching boards from the Notes sidebar used to reassign this iframe's
  // `src`, which reloads the whole document (fresh network request, blank
  // flash while it re-parses) for what should be an in-place swap -- since
  // this page never navigates away on its own, the sidebar now only does
  // that for the very first mount and posts a message for every switch
  // after that.
  window.addEventListener('message', function(e) {
    if (e.origin !== location.origin) return;
    if (!e.data) return;
    if (e.data.type === 'sticky-board:select') {
      BOARD_ID = e.data.boardId || null;
      loadState().then(render);
    } else if (e.data.type === 'sticky-board:move-note') {
      moveNoteToColumn(e.data.noteId, e.data.targetColId, { prepend: e.data.prepend });
    }
  });

  // ── Init ───────────────────────────────────
  syncThemeFromParent();
  watchParentTheme();
  initColorPickerModal();
  loadState().then(render);

})();
</script>

</body>
</html>
