<!doctype html><html><head><meta charset="utf-8"><title>Silent form</title></head><body>
<form onsubmit="event.preventDefault(); document.getElementById('err').textContent = 'Something went wrong';">
  <label for="e">Email *</label><input id="e" type="email" required>
  <label for="n">Full name *</label><input id="n" required>
  <p id="err"></p><button type="submit">Submit</button>
</form></body></html>
