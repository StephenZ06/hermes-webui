# Local deployment guardrail: Docker Compose loads this file automatically
# alongside docker-compose.yml, so routine rebuilds keep browser chat routed
# through the authenticated Hermes Agent gateway.
services:
  hermes-webui:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HERMES_WEBUI_CHAT_BACKEND: gateway
      HERMES_WEBUI_GATEWAY_BASE_URL: http://host.docker.internal:8642
      HERMES_WEBUI_ONBOARDING_OPEN: 1
